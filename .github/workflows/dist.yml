# Builds the double-click distributions of Borba CAD on GitHub's machines: a folder and an archive
# for Linux, and for Windows. Start it by hand (Actions > Distribution > Run workflow) or by pushing a
# tag that starts with v.
#
# The Linux job runs in an Arch Linux container, the system the program is developed on, and runs the
# whole check before it packages. The Windows job was written without a Windows machine to try it on:
# if it fails, the log says where, and docs/development.md ("Windows") lists what is known to be
# unproven.

name: Distribution

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install the tools and libraries
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git sbcl sdl2-compat freetype2 noto-fonts \
            xorg-server-xvfb mesa curl
      - uses: actions/checkout@v4
      - name: Let git work in the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Quicklisp at the version the project pins
        run: |
          curl -fsSL -o /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
          sbcl --noinform --non-interactive --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install)' \
            --eval '(ql-dist:install-dist "http://beta.quicklisp.org/dist/quicklisp/2026-01-01/distinfo.txt" :replace t :prompt nil)'
      - name: Check, build, package and verify
        run: xvfb-run -a make check dist dist-check
      - uses: actions/upload-artifact@v4
        with:
          name: borba-cad-linux
          path: dist/*.tar.gz

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make git zip curl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-sbcl
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-freetype
      - name: Install Quicklisp at the version the project pins
        run: |
          curl -fsSL -o /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
          sbcl --noinform --non-interactive --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install)' \
            --eval '(ql-dist:install-dist "http://beta.quicklisp.org/dist/quicklisp/2026-01-01/distinfo.txt" :replace t :prompt nil)'
      - name: Fetch the Noto fonts
        run: |
          mkdir -p "$RUNNER_TEMP/fonts"
          base=https://github.com/notofonts/notofonts.github.io/raw/main/fonts
          curl -fsSL -o "$RUNNER_TEMP/fonts/NotoSans-Regular.ttf" "$base/NotoSans/hinted/ttf/NotoSans-Regular.ttf"
          curl -fsSL -o "$RUNNER_TEMP/fonts/NotoSans-Medium.ttf" "$base/NotoSans/hinted/ttf/NotoSans-Medium.ttf"
          curl -fsSL -o "$RUNNER_TEMP/fonts/NotoSansMono-Regular.ttf" "$base/NotoSansMono/hinted/ttf/NotoSansMono-Regular.ttf"
      - name: Build and package
        run: FONT_DIRECTORY="$RUNNER_TEMP/fonts" make dist-windows
      - uses: actions/upload-artifact@v4
        with:
          name: borba-cad-windows
          path: dist/*.zip
